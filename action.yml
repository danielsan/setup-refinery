name: 'Setup refinery CLI'
description: >-
  Install the refinery SQL migration CLI (rust-db/refinery) on Linux, macOS or
  Windows runners in about a second. Downloads a prebuilt, checksum-verified
  binary instead of spending minutes on cargo install.
author: 'Daniel Santana'

branding:
  icon: 'database'
  color: 'purple'

inputs:
  version:
    description: >-
      Version of refinery to install. Accepts "latest", an exact version
      ("0.9.2" or "v0.9.2"), or a partial version ("0.9" = newest 0.9.x).
      Resolves against this repository's releases, not upstream rust-db/refinery
      tags. Semver ranges such as "^0.9" are not supported.
      Pin an exact version to skip the GitHub API entirely.
    required: false
    default: 'latest'

  token:
    description: >-
      GitHub token used only to look up releases when `version` is "latest" or
      partial; an exact version needs no API call. Defaults to the workflow
      token. Supply a PAT if your runners share an egress IP and hit the
      60 requests/hour unauthenticated limit.
    required: false
    default: ${{ github.token }}

  fallback:
    description: >-
      What to do when no prebuilt binary exists for the requested version and
      platform. "none" (default) fails fast with the available versions listed.
      "cargo" builds via `cargo install refinery_cli`, which takes 3-10 minutes
      of billed CI time and requires a Rust toolchain already on PATH.
    required: false
    default: 'none'

outputs:
  version:
    description: 'Exact version installed, normalized without a leading "v" (e.g. "0.9.2").'
    value: ${{ steps.install.outputs.version }}
  bin-path:
    description: 'Absolute path to the refinery executable, in native path form (includes .exe on Windows).'
    value: ${{ steps.install.outputs.bin-path }}
  cache-hit:
    description: >-
      "true" if the binary came from the runner tool cache and nothing was
      downloaded. Always "false" for the first install in a job on
      GitHub-hosted runners, which get a fresh VM per job.
    value: ${{ steps.install.outputs.cache-hit }}

runs:
  using: 'composite'
  steps:
    - name: Install refinery
      id: install
      shell: bash
      env:
        # Composite actions do not expose inputs as INPUT_* automatically
        # (actions/runner#665), so map them explicitly.
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_FALLBACK: ${{ inputs.fallback }}
        # Empty when invoked as `uses: ./`; the script falls back to
        # GITHUB_REPOSITORY in that case.
        ACTION_REPOSITORY: ${{ github.action_repository }}
      # $GITHUB_ACTION_PATH rather than ${{ github.action_path }}
      # (actions/runner#2185), and invoked via `bash` so a lost executable bit
      # cannot break consumers.
      run: bash "$GITHUB_ACTION_PATH/scripts/setup.sh"

    - name: Verify refinery on PATH
      shell: bash
      env:
        EXPECTED_VERSION: ${{ steps.install.outputs.version }}
      run: bash "$GITHUB_ACTION_PATH/scripts/verify.sh"
