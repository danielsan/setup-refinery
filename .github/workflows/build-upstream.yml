# Compile upstream refinery_cli for every supported platform and publish the
# binaries as release assets of THIS repository.
#
# The release is created as a DRAFT first and published last. That is what makes
# "created exactly once" and "consumers never see a half-populated release" both
# true without any locking, and it lets the real composite action be tested
# against the draft before anybody can consume it.
name: build-upstream

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'refinery_cli version to build (blank = latest stable on crates.io)'
        type: string
      dry_run:
        description: 'Build and verify only; create no release and upload nothing'
        type: boolean
        default: false
      force:
        description: 'Rebuild targets that already have an asset'
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      dry_run:
        type: boolean
        default: false
      force:
        type: boolean
        default: false

# Least privilege by default; individual jobs elevate only what they need.
permissions:
  contents: read

concurrency:
  group: build-upstream-${{ inputs.version || 'latest' }}
  # Never cancel a run that may be midway through uploading release assets.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  resolve:
    name: resolve version and plan
    runs-on: ubuntu-latest
    permissions:
      # write, not read: the GitHub API only returns DRAFT releases to a token
      # with push access. With contents:read this job cannot see the assets of a
      # release it has not published yet, so it would re-plan and rebuild every
      # target on each re-run. It only ever reads.
      contents: write
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
      upstream_sha1: ${{ steps.plan.outputs.upstream_sha1 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_FORCE: ${{ inputs.force }}
        run: bash scripts/resolve-upstream.sh

  guard-tag:
    name: guard tag namespace
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      # The two tag namespaces in this repo must never collide: `v1.2.3` is an
      # ACTION release that consumers pin, `refinery-v0.9.2` is a binary payload.
      # A bare `v0.9.2` tag would be a valid `uses: ...@v0.9.2` and read as an
      # action version. Enforced here so the invariant survives anyone who has
      # not read AGENTS.md.
      - name: Assert the tag is a binary-payload tag
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          case "$TAG" in
            refinery-v[0-9]*.[0-9]*.[0-9]*) echo "ok: $TAG" ;;
            *) echo "::error::refusing to create '$TAG': binary releases must be tagged refinery-v<X.Y.Z>"; exit 1 ;;
          esac

  create-draft-release:
    name: create draft release
    needs: [resolve, guard-tag]
    if: needs.resolve.outputs.any == 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Create the draft release if it does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          SHA1: ${{ needs.resolve.outputs.upstream_sha1 }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; nothing to do (idempotent)"
            exit 0
          fi
          cat > notes.md <<NOTES
          Prebuilt binaries for [refinery](https://github.com/rust-db/refinery) CLI **$VERSION**.

          These are **not** an upstream release. They are compiled by
          [\`build-upstream.yml\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          from the crates.io source of \`refinery_cli $VERSION\`
          (upstream commit [\`${SHA1:0:12}\`](https://github.com/rust-db/refinery/commit/$SHA1))
          and redistributed under the MIT option of refinery's \`MIT OR Apache-2.0\`.

          Install them with:

          \`\`\`yaml
          - uses: ${{ github.repository }}@v1
            with:
              version: '$VERSION'
          \`\`\`

          Each archive contains the binary, upstream \`LICENSE\`,
          \`THIRD-PARTY-NOTICES.md\` and \`BUILDINFO.txt\` recording the exact build
          inputs. Verify downloads against the \`.sha256\` sidecars or \`SHA256SUMS\`.

          Built with refinery's default features (\`mysql\`, \`postgresql\`,
          \`sqlite-bundled\`, \`mssql\`) and **without** \`int8-versions\`.
          NOTES
          # --latest=false keeps /releases/latest and the Marketplace badge on the
          # ACTION release rather than a refinery binary payload.
          gh release create "$TAG" \
            --draft \
            --latest=false \
            --title "refinery CLI $VERSION (prebuilt binaries)" \
            --notes-file notes.md

  build:
    name: ${{ matrix.target }}
    needs: [resolve, create-draft-release]
    # always() so a dry run (which skips create-draft-release) still builds.
    if: |
      always() && needs.resolve.outputs.any == 'true'
      && needs.resolve.result == 'success'
      && needs.create-draft-release.result != 'failure'
    strategy:
      # One bad target must never kill the other four.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    # lto=true plus three C libraries built from source; arm64 musl is slowest.
    # Measured ~4 min on 20 cores, so expect 15-25 min on a 4-core runner.
    timeout-minutes: 75
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      TARGET: ${{ matrix.target }}
      UPSTREAM_SHA1: ${{ needs.resolve.outputs.upstream_sha1 }}
      # Replicate upstream's .cargo/config.toml, which is NOT in the published
      # crate. libsqlite3-sys APPENDS these to its defaults, so omitting it
      # silently ships a SQLite without floor()/pow().
      LIBSQLITE3_FLAGS: '-DSQLITE_ENABLE_MATH_FUNCTIONS'
      # Replicate upstream's workspace [profile.release], also absent from the crate.
      CARGO_PROFILE_RELEASE_LTO: 'true'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '1'
      CARGO_PROFILE_RELEASE_STRIP: 'symbols'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: '1.90.0'
          targets: ${{ matrix.target }}

      - name: Install musl toolchain (Linux)
        if: matrix.libc == 'musl'
        run: |
          sudo apt-get update -qq
          # perl and make are needed by OpenSSL's Configure; musl-tools provides
          # musl-gcc for the three C dependencies.
          sudo apt-get install -y --no-install-recommends musl-tools perl make pkg-config
          musl-gcc --version | head -1
          perl -MIPC::Cmd -e 'print "IPC::Cmd ok\n"'

      - name: Fetch and verify source
        env:
          SRC_DIR: src-build
        run: bash scripts/fetch-source.sh

      - name: Build
        working-directory: src-build/refinery_cli-${{ needs.resolve.outputs.version }}
        shell: bash
        env:
          # Target-prefixed, NOT bare CC: host build scripts must keep using the
          # normal glibc cc.
          CC_x86_64_unknown_linux_musl: ${{ matrix.libc == 'musl' && 'musl-gcc' || '' }}
          CC_aarch64_unknown_linux_musl: ${{ matrix.libc == 'musl' && 'musl-gcc' || '' }}
          # Pinned so the binary's minimum macOS is a decision, not a default.
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          set -euo pipefail
          # Empty on Linux, where the vendored-openssl patch changes the edge list.
          locked="$(cat .locked_flag)"
          # NEVER --all-features: that enables int8-versions, which changes
          # refinery_schema_history semantics.
          # shellcheck disable=SC2086
          cargo build $locked --release --target "$TARGET" --bin refinery

      - name: Assert the feature contract
        working-directory: src-build/refinery_cli-${{ needs.resolve.outputs.version }}
        shell: bash
        run: bash "$GITHUB_WORKSPACE/scripts/assert-features.sh"

      - name: Verify binary (Unix)
        if: runner.os != 'Windows'
        env:
          BIN: src-build/refinery_cli-${{ needs.resolve.outputs.version }}/target/${{ matrix.target }}/release/refinery
        run: bash scripts/verify-binary.sh

      - name: Verify binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          BIN: src-build/refinery_cli-${{ needs.resolve.outputs.version }}/target/${{ matrix.target }}/release/refinery.exe
        run: bash scripts/verify-binary.sh

      - name: Assert Windows linkage
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "src-build/refinery_cli-${{ needs.resolve.outputs.version }}/target/${{ matrix.target }}/release/refinery.exe"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $deps = & $dumpbin /dependents $bin
          $deps | Write-Host
          # Windows uses SChannel via native-tls, so OpenSSL must not appear, and
          # SQLite is bundled so there must be no sqlite3.dll either.
          if ($deps -match 'libssl|libcrypto|sqlite3\.dll') {
            Write-Host "::error::unexpected dynamic dependency on the Windows binary"
            exit 1
          }
          Write-Host "linkage: no OpenSSL or sqlite3.dll, as expected"

      - name: Package
        shell: bash
        env:
          EXT: ${{ matrix.ext }}
          EXE: ${{ matrix.exe }}
          EXTRA_EXT: ${{ matrix.extra_ext }}
          OPENSSL_KIND: ${{ matrix.openssl }}
        run: bash scripts/package.sh

      - name: Attest build provenance
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/refinery-${{ needs.resolve.outputs.version }}-${{ matrix.target }}.*

      - name: Upload to the draft release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        shell: bash
        # Only the archives and their sidecars. BUILDINFO-<target>.txt exists in
        # dist/ purely for the step summary; the same content already ships
        # inside every archive, so uploading it too would just be clutter.
        run: |
          set -euo pipefail
          # Collect what exists rather than globbing inline: on non-Windows there
          # is no .zip, and a trailing false test would fail the step under bash -e.
          files=()
          for f in dist/refinery-*.tar.gz dist/refinery-*.tar.gz.sha256 \
                   dist/refinery-*.zip dist/refinery-*.zip.sha256; do
            [ -e "$f" ] && files+=("$f")
          done
          [ ${#files[@]} -gt 0 ] || { echo "::error::nothing to upload from dist/"; exit 1; }
          printf 'uploading %s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber

      - name: Summarise
        if: always()
        shell: bash
        run: |
          {
            printf '### %s\n\n' "$TARGET"
            printf '```\n'
            cat "dist/BUILDINFO-$TARGET.txt" 2>/dev/null || echo '(build did not reach packaging)'
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

  finalize:
    name: aggregate checksums and assert completeness
    needs: [resolve, build]
    # `build` is skipped when every asset already exists (a re-run of an
    # interrupted release). That must still reach finalize/publish, so key off
    # "build did not fail" rather than "build succeeded".
    if: ${{ !inputs.dry_run && !cancelled() && needs.build.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build SHA256SUMS from what is actually on the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dl && cd dl
          # Includes assets carried over from an earlier partial run, not just the
          # ones this run produced.
          gh release download "$TAG" --pattern 'refinery-*' --clobber
          rm -f SHA256SUMS
          # Sidecars are excluded: SHA256SUMS covers the archives themselves.
          find . -maxdepth 1 -type f \
               \( -name 'refinery-*.tar.gz' -o -name 'refinery-*.zip' \) \
               -printf '%f\n' | sort > archives.txt
          [ -s archives.txt ] || { echo "::error::no archives found on $TAG"; exit 1; }
          xargs -a archives.txt sha256sum > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber

      - name: Refuse to publish a partial release
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          jq -r --arg v "$VERSION" \
            '.targets[] | "refinery-\($v)-\(.target).\(.ext)"' \
            .github/targets.json | sort > expected.txt
          # archives.txt was produced by the previous step from what is actually
          # attached to the release.
          missing="$(comm -23 expected.txt dl/archives.txt || true)"
          if [ -n "$missing" ]; then
            echo "::error::release is incomplete; refusing to publish"
            while IFS= read -r m; do
              [ -n "$m" ] && echo "  missing: $m"
            done <<< "$missing"
            exit 1
          fi
          echo "all $(wc -l < expected.txt) expected assets are present"

  # Publish BEFORE smoke-testing, then roll back on failure.
  #
  # The alternative -- smoke-test the draft, then publish -- cannot work honestly:
  # draft assets are invisible at the public download URL and invisible to a
  # read-only token, so testing them requires push access and therefore exercises
  # a code path no real consumer ever takes, while leaving the path they DO take
  # untested. Publishing first lets the smoke test be a truthful consumer:
  # unauthenticated, straight off the public URL.
  #
  # The exposure window is the couple of minutes the smoke test takes, and these
  # releases are make_latest=false, so a bad one is never "Latest".
  publish:
    name: publish the release
    needs: [resolve, finalize]
    if: ${{ always() && !inputs.dry_run && needs.finalize.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Undraft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        # --latest=false again: undrafting must not steal "Latest release" from
        # the action's own v1.x release.
        run: |
          gh release edit "$TAG" --draft=false --latest=false
          echo "::notice::published $TAG (pending consumer verification)"

  consumer-smoke:
    name: consumer smoke (${{ matrix.runner }})
    needs: [resolve, publish]
    if: ${{ always() && !inputs.dry_run && needs.publish.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.runner }}
    permissions:
      # Exactly what a consumer has. No more.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # No `token:` input on purpose. An exact version resolves with zero API
      # calls and downloads straight from the public URL -- the real consumer path.
      - uses: ./
        id: setup
        with:
          version: ${{ needs.resolve.outputs.version }}
      - shell: bash
        run: |
          set -euo pipefail
          refinery --version
          refinery migrate --help > /dev/null
          echo "resolved=${{ steps.setup.outputs.version }} cache-hit=${{ steps.setup.outputs.cache-hit }}"
          # Prove the licence and provenance really travel with the binary.
          d="$(dirname '${{ steps.setup.outputs.bin-path }}')"
          for f in LICENSE BUILDINFO.txt THIRD-PARTY-NOTICES.md; do
            [ -s "$d/$f" ] || { echo "::error::$f missing from the installed archive"; exit 1; }
          done
          echo "licence and provenance files present"

  rollback:
    name: roll back to draft
    needs: [resolve, publish, consumer-smoke]
    # Only when the release was actually published and verification then failed.
    if: ${{ always() && !inputs.dry_run && needs.publish.result == 'success' && needs.consumer-smoke.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Return the release to draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          gh release edit "$TAG" --draft=true
          echo "::error::consumer verification failed; $TAG was returned to draft and is not downloadable"
          exit 1
